<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>CHORDLAB · Audio verification</title>
  <style>
    body {
      font: 16px system-ui;
      background: #171b1a;
      color: #e6e9e2;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 15px;
      font: inherit;
    }
    pre {
      white-space: pre-wrap;
      line-height: 1.8;
    }
  </style>
  <h1>Real Web Audio verification</h1>
  <p>
    This developer check renders the actual oscillator, sampled piano and
    envelope graphs with OfflineAudioContext. It checks signal, finite samples,
    headroom, release tails, cleanup and cancellation without playing through
    speakers.
  </p>
  <button id="run">Run audio verification</button>
  <pre id="result" role="status">Ready.</pre>
  <script type="module">
    import { AudioEngine } from "../src/audio.js";
    import { GrandPiano } from "../src/grand-piano.js";
    import { Playback } from "../src/playback.js";
    import { newProject } from "../src/project.js";
    const result = document.getElementById("result");
    document.getElementById("run").onclick = async () => {
      result.textContent = "Running…";
      try {
        const reports = [];
        for (const instrument of [
          "soft-piano",
          "electric-piano",
          "synth-pad",
          "plucked-synth",
          "organ",
        ]) {
          const context = new OfflineAudioContext(1, 44100 * 2, 44100),
            audio = new AudioEngine();
          audio.context = context;
          audio.master = context.createGain();
          audio.master.gain.value = 0.65;
          audio.master.connect(context.destination);
          audio.instrument = instrument;
          [60, 64, 67, 71].forEach((n) => audio.note(n, 0.05, 0.55));
          const buffer = await context.startRendering(),
            samples = buffer.getChannelData(0);
          let peak = 0;
          for (const n of samples) {
            if (!Number.isFinite(n))
              throw new Error(`${instrument}: invalid samples`);
            peak = Math.max(peak, Math.abs(n));
          }
          const tail = samples.slice(-2205).some((n) => Math.abs(n) > 0.00001);
          if (peak < 0.0001 || peak >= 1 || tail || audio.voices.size)
            throw new Error(
              `${instrument}: signal/headroom/release/cleanup failed`,
            );
          reports.push(
            `PASS ${instrument}: signal present, no clipping, silent tail, no retained voices`,
          );
        }
        const context = new OfflineAudioContext(1, 44100, 44100),
          audio = new AudioEngine();
        audio.context = context;
        audio.master = context.createGain();
        audio.master.connect(context.destination);
        audio.note(60, 0.5, 0.25, "transport");
        audio.stop("transport");
        const samples = (await context.startRendering()).getChannelData(0);
        if (samples.some((n) => Math.abs(n) > 0.00001) || audio.voices.size)
          throw new Error("Future-note cancellation failed");
        reports.push(
          "PASS future-note cancellation: silent render, no retained voices",
        );
        const grandContext = new OfflineAudioContext(2, 44100 * 2, 44100);
        const bank = new GrandPiano(grandContext);
        await bank.load();
        const piano = new AudioEngine();
        piano.context = grandContext;
        piano.master = grandContext.createGain();
        piano.master.gain.value = 0.65;
        piano.master.connect(grandContext.destination);
        piano.instrument = "grand-piano";
        piano.grandPiano = bank;
        [60, 64, 67, 72].forEach((note) => piano.note(note, 0.05, 0.6));
        const grandRender = await grandContext.startRendering();
        let grandPeak = 0;
        for (
          let channel = 0;
          channel < grandRender.numberOfChannels;
          channel++
        ) {
          const signal = grandRender.getChannelData(channel);
          for (const value of signal) {
            if (!Number.isFinite(value))
              throw new Error("Grand piano produced an invalid sample");
            grandPeak = Math.max(grandPeak, Math.abs(value));
          }
          if (signal.slice(-2205).some((n) => Math.abs(n) > 0.00001))
            throw new Error("Grand piano release tail did not finish");
        }
        if (grandPeak < 0.0001 || grandPeak >= 1 || piano.voices.size)
          throw new Error("Grand piano signal/headroom/cleanup failed");
        reports.push(
          `PASS sampled grand piano: 21 real MP3 files decoded, peak ${grandPeak.toFixed(4)}, silent release tail, no retained voices`,
        );
        const cancelContext = new OfflineAudioContext(2, 44100, 44100),
          cancelledPiano = new AudioEngine();
        cancelledPiano.context = cancelContext;
        cancelledPiano.master = cancelContext.createGain();
        cancelledPiano.master.connect(cancelContext.destination);
        cancelledPiano.instrument = "grand-piano";
        cancelledPiano.grandPiano = bank;
        cancelledPiano.note(60, 0.01, 0.5, "transport");
        cancelledPiano.stop("transport");
        const cancelledRender = await cancelContext.startRendering();
        if (
          cancelledRender
            .getChannelData(0)
            .some((n) => Math.abs(n) > 0.00001) ||
          cancelledPiano.voices.size
        )
          throw new Error("Grand piano future cancellation failed");
        reports.push(
          "PASS sampled grand piano cancellation: silent render before onset, no retained voices",
        );
        for (const instrument of ["soft-piano", "grand-piano"]) {
          for (const part of ["chords", "melody"]) {
            const energy = [];
            for (const sustain of [0, 2]) {
              const renderContext = new OfflineAudioContext(
                1,
                44100 * 2,
                44100,
              );
              const engine = new AudioEngine();
              engine.context = renderContext;
              engine.master = renderContext.createGain();
              engine.master.connect(renderContext.destination);
              engine.instrument = instrument;
              engine.grandPiano = bank;
              engine.init = async () => {};
              const originalNote = engine.note.bind(engine);
              const pitch = part === "chords" ? 48 : 72;
              // Isolate one root voice so later chords cannot mask its release.
              engine.note = (note, ...args) =>
                note === pitch ? originalNote(note, ...args) : null;
              const project = newProject();
              project.tempo = 120;
              project.sustain[part] = sustain;
              project.progression =
                part === "chords"
                  ? [
                      { degree: 0, beats: 0.25, inversion: 0, seventh: false },
                      { degree: 4, beats: 3.75, inversion: 0, seventh: false },
                    ]
                  : [];
              project.melody =
                part === "melody" ? [{ pitch, start: 0, beats: 0.25 }] : [];
              const transport = new Playback(engine, () => {});
              await transport.play(project, false, part);
              clearInterval(transport.timer);
              const rendered = await renderContext.startRendering();
              const window = rendered
                .getChannelData(0)
                .slice(44100 * 0.55, 44100 * 0.65);
              energy.push(
                window.reduce((sum, value) => sum + value * value, 0),
              );
              if (engine.voices.size)
                throw new Error(
                  `${instrument} ${part}: sustain retained voices`,
                );
              transport.stop();
            }
            if (energy[0] > 0.000000001 || energy[1] < 0.00000001)
              throw new Error(
                `${instrument} ${part}: sustain did not extend the rendered tail (dry/wet energy ${energy.join(" / ")})`,
              );
          }
          reports.push(
            `PASS ${instrument} track sustain: chord and melody rendered tails extend beyond silent dry tails, no retained voices`,
          );
        }
        const decodedBytes = [...bank.buffers.values()].reduce(
          (sum, sample) =>
            sum + sample.buffer.length * sample.buffer.numberOfChannels * 4,
          0,
        );
        reports.push(
          `Decoded sample bank: ${(decodedBytes / 1048576).toFixed(1)} MiB in this browser.`,
        );
        result.textContent =
          reports.join("\n") + "\n10 / 10 real audio checks passed.";
      } catch (error) {
        result.textContent = `FAIL ${error.message}`;
      }
    };
  </script>
</html>
